}

body {

.glass-card {

  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-light);
  padding: 1rem;
  margin-bottom: 1rem;
}

.clinic-card {
  background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);

  padding: 1rem;
  margin-bottom: 0.875rem;

  border: 1px solid rgba(0, 0, 0, 0.05);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.clinic-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--grad-medical);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.clinic-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-medium);
}

.clinic-card:hover::before {

}

  margin-right: 0.5rem;

.type-hospital {

}

.type-clinic {

  color: #1e40af;
}

.type-dentist {

}

  updateStats();
  loadClinics();
});

// 切換收藏狀態
function toggleFavorite(clinicName) {
  const index = favorites.indexOf(clinicName);
  if (index > -1) {
    favorites.splice(index, 1);
  } else {
    favorites.push(clinicName);
  }
  localStorage.setItem('hospitalFavorites', JSON.stringify(favorites));
  loadClinics();
}

// 檢查是否收藏

  return favorites.includes(clinicName);
}

    hours: '每日 08:00-22:00',

// 更新統計資訊
function updateStats() {
  const total = clinicsData.length;
  const hospitals = clinicsData.filter(c => c.type === '醫院').length;
  const clinics = clinicsData.filter(c => c.type === '診所').length;
  const filtered = getFilteredClinics().length;
  
  document.getElementById('totalCount').textContent = total;
  document.getElementById('hospitalCount').textContent = hospitals;
  document.getElementById('clinicCount').textContent = clinics;
  document.getElementById('filteredCount').textContent = filtered;
  
  const resultCount = document.getElementById('resultCount');
  resultCount.textContent = `找到 ${filtered} 筆`;
}

// 載入診所列表
function loadClinics() {
  const clinicsList = document.getElementById('clinicsList');
  const filteredClinics = getFilteredClinics();
  
  updateStats();
  
  if (filteredClinics.length === 0) {
    clinicsList.innerHTML = `
      <div class="glass-card empty-state">
        <div class="empty-state-icon">🔍</div>
        <p class="text-lg font-semibold mb-2 text-gray-700">沒有找到相關診所</p>
        <p class="text-sm text-gray-500">試試調整搜尋條件或選擇其他分類</p>
      </div>
    `;
    return;
  }

  clinicsList.innerHTML = `<div class="clinics-grid">${filteredClinics.map(clinic => {
    const typeClass = clinic.type === '醫院' ? 'type-hospital' : 
                      clinic.type === '診所' ? 'type-clinic' :
                      clinic.type === '牙醫' ? 'type-dentist' :
                      clinic.type === '眼科' ? 'type-ophthalmology' :
                      clinic.type === '中醫' ? 'type-chinese' :
                      clinic.type === '藥局' ? 'type-pharmacy' : 'type-clinic';
    
    const ratingStars = '⭐'.repeat(Math.floor(clinic.rating));
    const hasHalfStar = clinic.rating % 1 >= 0.5;
    const departmentsHtml = clinic.departments.map(dept => 
      `<span class="department-tag">${dept}</span>`
    ).join('');
    
    return `
      <div class="clinic-card">
        <div class="clinic-header">
          <div class="clinic-name-section">
            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
              <h3 class="font-bold text-base text-gray-800">${clinic.name}</h3>
              <span class="clinic-type ${typeClass}">${clinic.type}</span>
              <button 
                onclick="toggleFavorite('${clinic.name}')" 
                class="ml-auto text-xl ${isFavorite(clinic.name) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors"
                title="${isFavorite(clinic.name) ? '取消收藏' : '加入收藏'}"
              >
                ${isFavorite(clinic.name) ? '⭐' : '☆'}
              </button>
            </div>
            <div class="rating">
              ${ratingStars}${hasHalfStar ? '⭐' : ''} ${clinic.rating}
            </div>
          </div>
        </div>
        
        <div class="mb-3 space-y-1.5">
          <div class="info-item">
            <span class="info-icon">📍</span>
            <span class="text-gray-700 flex-1 text-sm leading-relaxed">${clinic.address}</span>
          </div>
          <div class="info-item">
            <span class="info-icon">📞</span>
            <a href="tel:${clinic.phone.replace(/-/g, '')}" class="phone-link text-sm">${clinic.phone}</a>
          </div>
          <div class="info-item">
            <span class="info-icon">🕒</span>
            <span class="hours-info text-sm">${clinic.hours}</span>
          </div>
        </div>
        
        ${clinic.departments.length > 0 ? `
          <div class="mb-3">
            <div class="text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wide">科別服務</div>
            <div class="flex flex-wrap">
              ${departmentsHtml}
            </div>
          </div>
        ` : ''}
        
        ${clinic.note ? `
          <div class="text-xs text-gray-600 mb-3 p-2.5 bg-gradient-to-r from-gray-50 to-gray-100 rounded-lg border-l-4 border-green-400 leading-relaxed">
            <span class="font-semibold text-gray-700">💡</span> ${clinic.note}
          </div>
        ` : ''}
        
        <div class="flex gap-2 mt-3">
          <a 
            href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(clinic.address)}" 
            target="_blank"
            class="btn-action"
            style="background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;"
          >
            <span>📍</span>
            <span>地圖導航</span>
          </a>
          <a 
            href="tel:${clinic.phone.replace(/-/g, '')}" 
            class="btn-action"
            style="background: linear-gradient(135deg, #10b981, #059669); color: white;"
          >
            <span>📞</span>
            <span>撥打電話</span>
          </a>
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

// 獲取篩選後的診所
function getFilteredClinics() {
  const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
  const currentFilterType = document.querySelector('.btn-filter.active')?.getAttribute('data-type') || '全部';
  
  return clinicsData.filter(clinic => {
    // 收藏篩選
    if (currentFilterType === '收藏') {
      if (!isFavorite(clinic.name)) return false;
    } else if (currentFilterType !== '全部') {
      const matchesType = clinic.type === currentFilterType;
      if (!matchesType) return false;
    }
    
    if (!searchText) return true;
    
    const matchesSearch = 
      clinic.name.toLowerCase().includes(searchText) || 
      clinic.address.toLowerCase().includes(searchText) ||
      clinic.phone.includes(searchText) ||
      clinic.departments.some(dept => dept.toLowerCase().includes(searchText)) ||
      (clinic.note && clinic.note.toLowerCase().includes(searchText));
    
    return matchesSearch;
  });
}

// 篩選診所
function filterClinics() {
  loadClinics();
}

// 按類型篩選
function filterByType(type) {
  // 更新按鈕狀態
  document.querySelectorAll('.btn-filter').forEach(btn => {
    const btnType = btn.getAttribute('data-type') || btn.textContent.replace(/[🏥🩺🦷👁️🌿💊⭐\s]/g, '').trim();
    if (btnType === type) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  
  loadClinics();
}
</script>
