  const index = favorites.indexOf(parkingName);

    favorites.push(parkingName);

// 計算兩點間距離（公里）
function calculateDistance(lat1, lng1, lat2, lng2) {
  const R = 6371; // 地球半徑（公里）
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// 獲取用戶位置
function getUserLocation() {
  const btn = document.getElementById('btnLocation');
  if (!navigator.geolocation) {
    alert('您的瀏覽器不支援地理定位功能');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = '定位中...';
  
  navigator.geolocation.getCurrentPosition(
    (position) => {
      userLocation = {
        lat: position.coords.latitude,
        lng: position.coords.longitude
      };
      localStorage.setItem('userLocation', JSON.stringify(userLocation));
      btn.textContent = '📌 已定位';
      btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
      btn.style.color = 'white';
      
      // 自動按距離排序
      if (currentSort !== 'distance') {
        sortBy('distance');
      } else {
        loadParking();
      }
    },
    (error) => {
      alert('無法取得您的位置，請確認已開啟定位權限');
      btn.disabled = false;
      btn.textContent = '📌 我的位置';
      console.error('定位錯誤:', error);
    }
  );
}

// 排序功能
function sortBy(sortType) {
  currentSort = sortType;
  
  // 更新按鈕狀態
  document.querySelectorAll('.sort-controls .btn-filter').forEach(btn => {
    if (btn.id && btn.id.startsWith('sort')) {
      btn.classList.remove('active');
    }
  });
  
  const sortBtn = document.getElementById(`sort${sortType.charAt(0).toUpperCase() + sortType.slice(1)}`);
  if (sortBtn) {
    sortBtn.classList.add('active');
  }
  
  loadParking();
}

  }
  // 設置預設排序按鈕狀態
  const sortBtn = document.getElementById(`sort${currentSort.charAt(0).toUpperCase() + currentSort.slice(1)}`);
  if (sortBtn) {
    sortBtn.classList.add('active');
  }
  loadParking();
});

// 載入停車場列表
function loadParking() {
  const parkingList = document.getElementById('parkingList');
  let filteredParking = getFilteredParking();
  
  // 計算距離並排序
  filteredParking = filteredParking.map(parking => {
    let distance = null;
    if (userLocation) {
      distance = calculateDistance(userLocation.lat, userLocation.lng, parking.lat, parking.lng);
    } else {
      distance = calculateDistance(CENTER_LAT, CENTER_LNG, parking.lat, parking.lng);
    }
    return { ...parking, distance };
  });
  
  // 排序
  filteredParking.sort((a, b) => {
    if (currentSort === 'distance') {
      return (a.distance || 999) - (b.distance || 999);
    } else if (currentSort === 'price') {
      return (a.hourlyRate || 999) - (b.hourlyRate || 999);
    } else {
      return a.name.localeCompare(b.name, 'zh-Hant');
    }
  });
  
  if (filteredParking.length === 0) {
    parkingList.innerHTML = `
      <div class="glass-card text-center py-8">
        <div class="text-4xl mb-4">🔍</div>
        <p class="text-lg font-semibold mb-2">沒有找到相關停車場</p>
        <p class="text-sm text-gray-600">試試調整搜尋條件或分類篩選</p>
      </div>
    `;
    return;
  }

  parkingList.innerHTML = filteredParking.map(parking => {
    const typeClass = parking.type === '公有' ? 'type-public' : 
                      parking.type === '私有' ? 'type-private' :
                      'type-street';
    
    const priceHtml = parking.hourlyRate === 0 ? 
      `<div class="price-info">
        <div class="price-highlight">免費</div>
        <div class="text-xs text-gray-600 mt-1">${parking.payment}</div>
      </div>` :
      `<div class="price-info">
        <div class="info-item">
          <span class="info-label">時租：</span>
          <span class="info-value price-highlight">$${parking.hourlyRate}/小時</span>
        </div>
        ${parking.dailyMax > 0 ? `
          <div class="info-item">
            <span class="info-label">日租上限：</span>
            <span class="info-value">$${parking.dailyMax}</span>
          </div>
        ` : ''}
        <div class="info-item">
          <span class="info-label">付費方式：</span>
          <span class="info-value">${parking.payment}</span>
        </div>
      </div>`;
    
    return `
      <div class="parking-card">
        <div class="flex items-start justify-between mb-2">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1.5">
              <h3 class="font-bold text-base flex-1">${parking.name}</h3>
              <span class="parking-type ${typeClass}">${parking.type}</span>
              ${parking.distance !== null && parking.distance !== undefined ? `
                <span class="distance-badge">${parking.distance < 1 ? (parking.distance * 1000).toFixed(0) + 'm' : parking.distance.toFixed(2) + 'km'}</span>
              ` : ''}
              <button 
                onclick="toggleFavorite('${parking.name}')" 
                class="text-lg ${isFavorite(parking.name) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors"
                title="${isFavorite(parking.name) ? '取消收藏' : '加入收藏'}"
              >
                ${isFavorite(parking.name) ? '⭐' : '☆'}
              </button>
            </div>
            <div class="info-item">
              <span class="info-label">📍</span>
              <span class="info-value">${parking.address}</span>
            </div>
            ${parking.totalSpots > 0 ? `
              <div class="info-item">
                <span class="info-label">車位：</span>
                <span class="info-value">約${parking.totalSpots}格</span>
              </div>
            ` : ''}
            <div class="info-item">
              <span class="info-label">🕒</span>
              <span class="info-value">${parking.hours}</span>
            </div>
            ${priceHtml}
            ${parking.note ? `
              <div class="text-xs text-gray-600 mt-2 p-1.5 bg-gray-50 rounded">
                💡 ${parking.note}
              </div>
            ` : ''}
          </div>
        </div>
        <a 
          href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(parking.address)}" 
          target="_blank"
          class="btn btn-primary w-full text-sm py-2"
        >
          📍 地圖導航
        </a>
      </div>
    `;
  }).join('');
}

// 獲取篩選後的停車場
function getFilteredParking() {
  const searchText = document.getElementById('searchInput').value.toLowerCase();
  const currentFilterType = document.querySelector('.btn-filter.active')?.getAttribute('data-type') || '全部';
  
  return parkingData.filter(parking => {
    // 收藏篩選
    if (currentFilterType === '收藏') {
      if (!isFavorite(parking.name)) return false;
    } else if (currentFilterType !== '全部') {
      const matchesType = parking.type === currentFilterType;
      if (!matchesType) return false;
    }
    
    const matchesSearch = parking.name.toLowerCase().includes(searchText) || 
                          parking.address.toLowerCase().includes(searchText) ||
                          (parking.note && parking.note.toLowerCase().includes(searchText));
    return matchesSearch;
  });
}

// 篩選停車場
function filterParking() {
  loadParking();
}

// 按類型篩選
function filterByType(type) {
  // 更新按鈕狀態
  document.querySelectorAll('.btn-filter').forEach(btn => {
    const btnType = btn.getAttribute('data-type') || btn.textContent.replace(/[⭐\s]/g, '').trim();
    if (btnType === type) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  
  loadParking();
}
</script>
